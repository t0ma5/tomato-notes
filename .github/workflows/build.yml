name: Build APK

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Simple-Commons
        uses: actions/checkout@v7
        with:
          repository: SimpleMobileTools/Simple-Commons
          ref: eceb48949ecca6fa86efd8e9225029da268458a9
          path: Simple-Commons
          persist-credentials: false

      - name: Patch Simple-Commons for CI
        run: |
          python3 scripts/patch_commons.py
          grep -E 'gradlePlugins-agp|^kotlin =|ksp =|kotlinCompose|rtlViewpager|rtl-viewpager|compileSDK|targetSDK' Simple-Commons/gradle/libs.versions.toml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36"

      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is required so this APK is release-signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          printf '%s\n' "keyAlias=$KEY_ALIAS" "keyPassword=$KEY_PASSWORD" "storeFile=keystore.jks" "storePassword=$KEYSTORE_PASSWORD" > keystore.properties

      - name: Build Core release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleCoreRelease --stacktrace --no-daemon

      - name: Name APK Tomato-Notes_<version>-FOSS-<abi>
        id: apk
        run: |
          VERSION=$(grep -oP 'app-version-versionName = "\K[^"]+' gradle/libs.versions.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          copy_abi() {
            local abi="$1"
            local src
            src=$(find app/build/outputs/apk/core/release -name "*${abi}*.apk" | head -n 1)
            test -n "$src"
            cp "$src" "dist/Tomato-Notes_${VERSION}-FOSS-${abi}.apk"
          }
          copy_abi arm64-v8a
          copy_abi armeabi-v7a
          copy_abi x86_64
          copy_abi universal
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Tomato-Notes_${{ steps.apk.outputs.version }}
          path: dist/Tomato-Notes_*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.apk.outputs.version }}
          files: dist/Tomato-Notes_*.apk
          generate_release_notes: true
          body: |
            Release-signed FOSS APKs for applicationId tomato.notes.
            `Tomato-Notes_<version>-FOSS-arm64-v8a.apk` for most phones; `...-armeabi-v7a.apk` for 32-bit ARM; `...-x86_64.apk` for 64-bit emulators; `...-FOSS-universal.apk` has all three ABIs.
            They can sit next to Play Store Simple Notes Pro. Launcher name is Notes.

            ## New in 1.0

            1. **Print** — If the print page fails to load, a toast reports the error.
            2. **Checklist dialogs** — Add and rename keep the text you typed when the phone rotates.
            3. **Read-only notes** — Overflow Make read-only / Allow editing. Blocks typing, checklist checks, and counter buttons. Survives app restart.
            4. **Keyboard** — Opening the keyboard on a long note scrolls the caret into view.
            5. **Paste** — Formatted paste becomes plain text. Composing keyboards (AnySoftKeyboard and similar) still work.
            6. **Widgets** — Settings → Customize widget colors updates every Notes widget, not only the first one. Home-screen notebook widget.
            7. **Save icon / search** — Saved text notes no longer show Save again after a swipe. In-note search no longer crashes after changing notes.
            8. **Android 16** — compileSdk and targetSdk 36. Toolbar sits below the status bar.
            9. **Notes / notebooks** — Toolbar icon switches a two-column notes card grid and the notebooks grid. Notes is the default after install. Create, rename, pin, reorder, lock, and delete notebooks. Cards show the count on the left and `:::` on the right. Lock a notebook with fingerprint, pattern, or PIN. Every notebook can be deleted. First install no longer creates a fake “General note”. Delete the last remaining note. Pin individual notes.
            10. **Search and tags** — Search notes, notebooks, and tags. Move checklist items or a whole note to another notebook.
            11. **Recycle bin** — Restore deleted notes and notebooks.
            12. **Write** — Markdown preview. Undo and redo. Counter notes with colored +/− buttons. Uncheck all, collapse checked items, and sort each checklist on its own.
            13. **About licences** — Third party licences include Gson, Markwon, and Kotlinx Serialization.
            14. **Dark red theme** — Dark page, contrasting cards, red toolbar and status bar. Settings no longer closes on its own.
            15. **Lock notes** — Lock a text note, checklist, or counter with fingerprint, pattern, or PIN. The card hides the preview and shows a lock in the lower-right.
            16. **Encrypted exports** — Export with a password (AES) or as plain text. Locks are stripped in the backup so another phone can restore.
            17. **Note cards** — Title plus 4 preview lines; each source line stays on one row and ellipsizes. Long-press a card to reorder.
            18. **No nags** — No donation, rate, or “what’s new” popups.
            19. **Checklist export** — Settings → Export notes writes checklist items in the order on screen (custom, title, date, or done, and done items at the bottom). Import keeps that order.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
