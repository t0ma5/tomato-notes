name: Build APK

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Simple-Commons
        uses: actions/checkout@v7
        with:
          repository: SimpleMobileTools/Simple-Commons
          ref: eceb48949ecca6fa86efd8e9225029da268458a9
          path: Simple-Commons
          persist-credentials: false

      - name: Patch Simple-Commons for CI
        run: |
          python3 scripts/patch_commons.py
          grep -E 'gradlePlugins-agp|^kotlin =|ksp =|kotlinCompose|rtlViewpager|rtl-viewpager|compileSDK|targetSDK|^material =' Simple-Commons/gradle/libs.versions.toml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36"

      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is required so this APK is release-signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          printf '%s\n' "keyAlias=$KEY_ALIAS" "keyPassword=$KEY_PASSWORD" "storeFile=keystore.jks" "storePassword=$KEYSTORE_PASSWORD" > keystore.properties

      - name: Build Core release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleCoreRelease --stacktrace --no-daemon

      - name: Name APK Tomato-Notes_<version>-FOSS-<abi>
        id: apk
        run: |
          VERSION=$(grep -oP 'app-version-versionName = "\K[^"]+' gradle/libs.versions.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          copy_abi() {
            local abi="$1"
            local src
            src=$(find app/build/outputs/apk/core/release -name "*${abi}*.apk" | head -n 1)
            test -n "$src"
            cp "$src" "dist/Tomato-Notes_${VERSION}-FOSS-${abi}.apk"
          }
          copy_abi arm64-v8a
          copy_abi armeabi-v7a
          copy_abi x86_64
          copy_abi universal
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Tomato-Notes_${{ steps.apk.outputs.version }}
          path: dist/Tomato-Notes_*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.apk.outputs.version }}
          files: dist/Tomato-Notes_*.apk
          generate_release_notes: true
          body: |
            Release-signed FOSS APKs for applicationId tomato.notes.
            `Tomato-Notes_<version>-FOSS-arm64-v8a.apk` for most phones; `...-armeabi-v7a.apk` for 32-bit ARM; `...-x86_64.apk` for 64-bit emulators; `...-FOSS-universal.apk` has all three ABIs.
            They can sit next to Play Store Simple Notes Pro. Launcher name is Notes.

            ## New in 1.1

            1. **Automatic backups** — They failed on every run and left an empty file; now they run in the background, only count successful runs, and restart after a reboot.
            2. **No silent deletes** — Notes linked to a file are kept when the file can't be seen (SD card removed, storage permission). Empty notes titled "General note" are no longer removed.
            3. **Stronger encryption** — Password exports use AES-256-GCM with a PBKDF2-SHA256 key, and a wrong password is always reported as such. Encrypted backup files made by 1.0 can't be imported. Your notes stay in the app, so make a new export after updating.
            4. **Notebook passwords** — Stored with a stronger PBKDF2 hash. Existing passwords keep working and upgrade on the next unlock.
            5. **Locks hold everywhere** — Locked notes and notebooks stay hidden on home-screen widgets, in list previews, search, share targets, "Move items", and the recents screen. Shortcuts, widgets, and shares ask for the notebook's lock. A misread fingerprint no longer closes the screen.
            6. **Widgets** — A widget shows when its note is deleted and comes back after a restore. New widgets no longer start blank. Checklists use the same order as the app and respect collapsed checked items.
            7. **Android 15 and 16** — The back gesture asks about unsaved changes and closes search again. Notes and buttons no longer sit under the gesture bar or keyboard.
            8. **Rotation and restore** — Note text and open dialogs survive rotation, and unsaved text survives the app being killed in the background.
            9. **Import** — Runs as one step, so a failed import leaves nothing half done. Custom checklist order is kept through export and import.
            10. **Crash fixes** — Damaged checklist data, external "open" intents without a file, and redo after the linked file changed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
